networks:
  foe_rbs_network:
    driver: bridge

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foe_rbs_backend
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    ports:
      - "8000:80"
    networks:
      - foe_rbs_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: foe_rbs_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - foe_rbs_network
    command: ["npm", "run", "dev"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped